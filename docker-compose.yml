services:
  postgres:
    image: postgres:16-alpine
    container_name: bookjournal-postgres
    environment:
      POSTGRES_USER: bookjournal
      POSTGRES_PASSWORD: bookjournal
      POSTGRES_DB: bookjournal
    ports:
      - "5432:5432"
    volumes:
      - bookjournal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookjournal -d bookjournal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookjournal-pgdata:
